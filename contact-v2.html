<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Maunhasan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style-v5.css">

  <style>
    .contact-hero {
      text-align: center;
      padding: var(--space-xl) 0;
    }
    .contact-hero p.subtitle {
      max-width: 460px;
      margin: var(--space-sm) auto var(--space-lg);
      color: var(--color-text-muted);
    }

    /* Ikon sosial versi BESAR khusus halaman ini, sekarang
       juga badge teks -- konsisten sama footer-icons */
    .contact-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: var(--space-lg);
      flex-wrap: wrap;
    }
    .contact-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      height: 56px;
      padding: 0 16px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
    }
    .contact-icons a:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background-color: var(--color-surface);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ============ NAVBAR ============ -->
    <nav class="navbar">
      <span class="logo">M.</span>
      <ul class="nav-links">
        <li><a href="home-v10.html">Home</a></li>
        <li><a href="about-v7.html">About</a></li>
        <li><a href="projects-v5.html">Projects</a></li>
        <li><a href="experience-v2.html">Experience</a></li>
        <li><a href="skills-v2.html">Skills</a></li>
        <li><a href="contact-v2.html">Contact</a></li>
        <li>
          <div class="lang-toggle">
            <button data-lang="id">ID</button>
            <button data-lang="en">EN</button>
          </div>
        </li>
      </ul>
    </nav>

    <!-- ============ CONTACT HERO ============ -->
    <section class="contact-hero reveal">
      <p class="eyebrow" style="justify-content:center;" data-i18n="contact.eyebrow1">01 — Kontak</p>
      <h1 data-i18n="contact.title">Mari Terhubung</h1>
      <p class="subtitle" data-i18n="contact.subtitle">
        Punya project menarik, ide kolaborasi, atau cuma mau say hi? Kabar dari kamu selalu saya tunggu.
      </p>

      <a href="mailto:maunhasan05@gmail.com" class="btn btn-primary" data-i18n="contact.btn.send">Kirim Pesan</a>

      <div class="contact-icons">
        <a href="mailto:maunhasan05@gmail.com" aria-label="Email">MAIL</a>
        <a href="https://github.com/maunhasan-dev" aria-label="GitHub" target="_blank" rel="noopener">GH</a>
        <a href="https://wa.me/6285161256322" aria-label="WhatsApp" target="_blank" rel="noopener">WA</a>
      </div>
    </section>

  </div>

  <script src="i18n-v1.js"></script>
  <script src="script-v5.js"></script>

</body>
</html>
